version: "3.9"

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: openchat-postgres-test
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openchat_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openchat_test"]
      interval: 5s
      timeout: 5s
      retries: 20
