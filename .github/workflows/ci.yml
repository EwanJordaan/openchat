name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Start PostgreSQL test container
        run: docker compose -f docker-compose.test.yml up -d postgres-test

      - name: Wait for PostgreSQL health
        run: |
          for i in {1..40}; do
            status=$(docker inspect --format='{{json .State.Health.Status}}' openchat-postgres-test || echo '"starting"')
            if [ "$status" = '"healthy"' ]; then
              echo "Postgres is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become healthy"
          docker logs openchat-postgres-test || true
          exit 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run full test suite
        env:
          NODE_ENV: test
          BETTER_AUTH_SECRET: test-secret-1234567890-1234567890
          DATABASE_PROVIDER: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:55432/openchat_test
          SETTINGS_ENCRYPTION_KEY: test-encryption-key
          OPENAI_BASE_URL: https://api.openai.com/v1
          MAX_UPLOAD_MB: 12
        run: bun run test:ci

      - name: Coverage
        env:
          NODE_ENV: test
          BETTER_AUTH_SECRET: test-secret-1234567890-1234567890
          DATABASE_PROVIDER: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:55432/openchat_test
          SETTINGS_ENCRYPTION_KEY: test-encryption-key
          OPENAI_BASE_URL: https://api.openai.com/v1
          MAX_UPLOAD_MB: 12
        run: bun run test:coverage

      - name: Stop PostgreSQL container
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
